  <path d="M307 212L338 238L307 264" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M274 215L238 266" stroke="url(#accent)" stroke-width="18" stroke-linecap="round"/>

  <path d="M256 330C289 330 318 310 331 281C317 310 289 330 256 330C223 330 195 310 181 281C194 310 223 330 256 330Z" fill="url(#accent)" fill-opacity="0.16"/>
  <path d="M256 343C304 343 345 315 363 274" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 24"/>
